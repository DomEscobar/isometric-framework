<!doctype html><meta charset=utf-8><title>MiniMax NE final atlas</title>
<style>body{background:#203b3d;color:#fff;font:14px system-ui}section{display:inline-block;margin:16px}canvas{image-rendering:pixelated;background:#124448} .x2{width:320px;height:320px}</style>
<h1>Transparent atlas, exact manifest playback</h1><section><p>160px native 1:1</p><canvas id=n width=160 height=160></canvas></section><section><p>160px integer 2x nearest</p><canvas id=x class=x2 width=160 height=160></canvas></section>
<script>Promise.all([fetch('atlas-160-manifest.json').then(r=>r.json()),new Promise((ok,no)=>{let i=new Image;i.onload=()=>ok(i);i.onerror=no;i.src='atlas-160.png'})]).then(([m,img])=>{let k=0,last=performance.now(),step=1000/m.clip.fps;function f(t){if(t-last>=step){k=(k+Math.floor((t-last)/step))%m.frames.length;last=t-(t-last)%step}let r=m.frames[k].rect;for(let id of ['n','x']){let c=document.getElementById(id),g=c.getContext('2d');g.clearRect(0,0,c.width,c.height);g.imageSmoothingEnabled=false;g.drawImage(img,r.x,r.y,r.width,r.height,0,0,c.width,c.height)}requestAnimationFrame(f)}requestAnimationFrame(f)})</script>
