server {
    listen 80;
    listen [::]:80;
    server_name isoani.huecki.com;
    location ^~ /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location / { return 301 https://isoani.huecki.com$request_uri; }
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name isoani.huecki.com;
    ssl_certificate /etc/letsencrypt/live/isoani.huecki.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/isoani.huecki.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    location = / { return 302 /animation/ui/; }
    location = /animation { return 302 /animation/ui/; }
    location = /animation/ { return 302 /animation/ui/; }
    location ^~ /animation/ {
        client_max_body_size 21m;
        proxy_pass http://127.0.0.1:4386/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 60s;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Cache-Control "no-store" always;
    }
    location / { return 404; }
}
