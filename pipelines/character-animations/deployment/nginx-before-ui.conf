server {

    server_name huecki.com www.huecki.com;

    access_log /var/log/nginx/huecki.access.log;
    error_log /var/log/nginx/huecki.error.log;

    # Waldlicht isolated static game release.
    location = /waldlicht { return 301 /waldlicht/; }
    location ^~ /waldlicht/ {
        root /var/www;
        index index.html;
        autoindex off;
        try_files $uri $uri/ =404;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Cache-Control no-cache always;
    }

    # Schwarz Campus: isolated production-only static build.
    location = /schwarz-campus { return 301 /schwarz-campus/; }
    location ^~ /schwarz-campus/ {
        root /var/www;
        index index.html;
        autoindex off;
        try_files $uri $uri/ =404;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Cache-Control "no-cache" always;
    }

    # Temporary, unlisted Astro draft preview.
    location ^~ /preview-7c8f2b1a/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host 127.0.0.1:3001;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    location ~ ^/(?:@vite|@id|@fs|src|node_modules)/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host 127.0.0.1:3001;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    location ^~ /blog/domain-agents/ {
        proxy_pass http://127.0.0.1:3001/preview-7c8f2b1a/blog/domain-agents/;
        proxy_set_header Host 127.0.0.1:3001;
    }

    location = /smarthome {
        return 301 /smarthome/;
    }

    location ^~ /smarthome/ {
        root /var/www;
        try_files $uri $uri/ /smarthome/index.html;

        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    }

    location = /tsv-michelbach {
        return 301 /tsv-michelbach/;
    }

    location ^~ /tsv-michelbach/ {
        root /var/www;
        try_files $uri $uri/ /tsv-michelbach/index.html;

        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self' https://tsv-michelbach.com https://media4agents.com data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    }

    # Public, non-sensitive external-brain bootstrap for AI web search.
    # Private/shared notes remain isolated on brain.huecki.com with noindex.
    location = /brain {
        proxy_pass http://127.0.0.1:27720/bootstrap/dom.html;
        proxy_http_version 1.1;
        proxy_set_header Host brain.huecki.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 60s;
    }

    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/huecki.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/huecki.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}

server {
    listen 80 default_server;
    listen [::]:80 default_server;

    server_name _;

    return 444;
}
server {
    if ($host = huecki.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;

    server_name huecki.com www.huecki.com;
    return 404; # managed by Certbot


}
